<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de ciclo privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--sf:#fff;--ink:#1d1b3a;--mu:#5b5f78;--pe:#c2305f;--peb:#fbdce6;--fe:#0f7c78;--feb:#d3efec;--ln:#d9dce8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131f;--sf:#1b1d2e;--ink:#ecebf7;--mu:#a2a5bd;--pe:#ff7aa2;--peb:#4a1f33;--fe:#5fd3cc;--feb:#17413f;--ln:#2e3150;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131f;--sf:#1b1d2e;--ink:#ecebf7;--mu:#a2a5bd;--pe:#ff7aa2;--peb:#4a1f33;--fe:#5fd3cc;--feb:#17413f;--ln:#2e3150;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Serif 4",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3,button,.tabs{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.2rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.95rem}
.tabs{display:flex;gap:6px;margin:12px 0 18px;border-bottom:1px solid var(--ln)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 12px;font-size:1rem;font-weight:500;cursor:pointer}
.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--pe);font-weight:700}
button{font-size:.95rem;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fe);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;margin:0 0 16px}
.hero{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center;margin:0 0 16px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:20px}
@media(max-width:620px){.hero{grid-template-columns:1fr;justify-items:center}}
.ringw{position:relative;width:260px;height:260px}
.ringw svg{width:260px;height:260px}
.t{stroke:var(--ln);stroke-width:3;stroke-linecap:round}
.t.p{stroke:var(--pe)}.t.f{stroke:var(--fe);opacity:.75}.t.o{stroke:var(--fe);stroke-width:5;opacity:1}
.t.now{stroke:var(--ink);stroke-width:5}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 54px}
.big{font:700 2.1rem/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.sm{font-size:.85rem;color:var(--mu);line-height:1.35;margin-top:4px}
dl{margin:0}dt{font:500 .85rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--mu);margin-top:10px}dd{margin:0;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mu)}
input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=number]{width:110px;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn,.pri{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-weight:500}
.pri{background:var(--pe);border-color:var(--pe);color:#fff}
:root[data-theme="dark"] .pri{color:#2a0a17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#2a0a17}}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font:500 .75rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--mu)}
.d{aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink);font:inherit;font-size:.9rem;padding:0;position:relative}
.d.x{visibility:hidden}
.d.lg{background:var(--pe);color:#fff;font-weight:700}
:root[data-theme="dark"] .d.lg{color:#2a0a17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .d.lg{color:#2a0a17}}
.d.pp{background:repeating-linear-gradient(135deg,var(--peb) 0 6px,color-mix(in srgb,var(--pe) 38%,var(--peb)) 6px 12px);border:2px solid var(--pe);font-weight:700}
.d.pr{background:color-mix(in srgb,var(--pe) 14%,transparent);border:1px dashed var(--pe)}
.d.fw{background:var(--feb)}
.d.ov{background:var(--feb);box-shadow:inset 0 0 0 2px var(--fe);font-weight:700}
.d.td{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.d.sel{outline:3px solid var(--ink);outline-offset:1px;font-weight:700}
.selbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding:12px;background:var(--bg);border:1px solid var(--ln);border-radius:12px}
.selbar strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;flex:1 1 100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--mu);margin-top:10px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.hist button{background:none;border:0;color:var(--pe);text-decoration:underline}
.fi{border-top:1px solid var(--ln);padding:14px 0}.fi:first-of-type{border-top:0;padding-top:0}
.fi p{margin:4px 0}.src{font-size:.85rem;color:var(--mu)}
a{color:var(--fe)}
textarea{width:100%;min-height:110px;font:.8rem/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px}
.note{font-size:.9rem;color:var(--mu);border-left:3px solid var(--fe);padding-left:12px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;display:none}
@media(prefers-reduced-motion:no-preference){.t.now{transition:stroke-width .2s}}
</style>
</head>
<body>
<main>
<h1>Seguimiento de ciclo privado</h1>
<p class="sub">Tus datos quedan en este navegador, en tu dispositivo. No se envía nada a ningún lado.</p>
<nav class="tabs" aria-label="Secciones">
<button data-a="tab" data-v="track">Seguimiento</button>
<button data-a="tab" data-v="research">Investigación</button>
<button data-a="tab" data-v="privacy">Datos y privacidad</button>
</nav>
<div id="app"></div>
</main>
<div id="toast" role="status"></div>
<script>
const KEY="cycle-private-v1",L=12;
let S={periods:[]},tab="track",pick="",wipeArm=false,V=new Date();
V=new Date(V.getFullYear(),V.getMonth(),1);
const $=s=>document.querySelector(s);
const D=s=>{const[a,b,c]=s.split("-").map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const F=n=>new Date(n*864e5).toISOString().slice(0,10);
const today=()=>{const t=new Date();return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)};
const fmt=n=>new Date(n*864e5).toLocaleDateString("es-AR",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const sh=n=>new Date(n*864e5).toLocaleDateString("es-AR",{month:"short",day:"numeric",timeZone:"UTC"});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.periods))S=o}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("No se pudo guardar en este navegador. Copiá una copia en Datos y privacidad.")}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2600)}
function stats(){
 const p=[...S.periods].sort((a,b)=>a.start<b.start?-1:1),cyc=[];
 for(let i=1;i<p.length;i++){const c=D(p[i].start)-D(p[i-1].start);if(c>=18&&c<=60)cyc.push(c)}
 const rec=cyc.slice(-6),n=rec.length,age=+S.age||0,bmi=+S.h&&+S.w?S.w/((S.h/100)**2):0,prior=age?29.3-0.18*(Math.min(45,Math.max(25,age))-25):29,mean=n?(rec.reduce((a,b)=>a+b)+2*prior)/(n+2):prior;
 const sd=n>1?Math.sqrt(rec.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):null;
 const pl=p.filter(x=>x.end).map(x=>D(x.end)-D(x.start)+1).filter(x=>x>0&&x<=14).slice(-6);
 const plen=pl.length?Math.round(pl.reduce((a,b)=>a+b)/pl.length):5;
 const sp=Math.ceil((n>=2?Math.max(2,sd):4)*(bmi>=30?1.14:1))+(age&&(age<20||age>=40)?1:0);
 const conf=n<3?"Baja (menos de 3 ciclos registrados)":sd<=2?"Mayor (ciclos estables)":sd<=4?"Moderada":"Baja (la duración varía mucho)";
 const wl=(S.wlog||[]).filter(x=>today()-D(x.d)<=90),wchg=wl.length>1&&Math.abs(wl[wl.length-1].w-wl[0].w)>=0.05*wl[0].w;
 return{p,rec,n,age,bmi,wchg,prior,mean,m:Math.round(mean),sd,plen,sp,conf,last:p.length?D(p[p.length-1].start):null}
}
function proj(st){
 if(st.last==null)return[];const r=[];
 for(let k=1;k<=3;k++){const s=st.last+k*st.m,sp=Math.ceil(st.sp*Math.sqrt(k)),ov=s-L;r.push({s,sp,ov,f1:ov-5-sp,f2:ov+1+sp})}
 return r
}
function ringH(st,pr){
 if(st.last==null)return`<section class="hero" style="display:block"><h2>Todavía no hay datos</h2><p class="sub">Registrá el primer día de tu última menstruación abajo. Las estimaciones aparecen después y mejoran con tres o más ciclos. Si cargás tu edad, la estimación inicial es más precisa.</p></section>`;
 const N=st.m,t=today()-st.last+1,o=N-L;let k="";
 for(let i=1;i<=N;i++){
  const a=(i-1)/N*6.2832-1.5708,c=Math.cos(a),s=Math.sin(a);let cl="t",r1=98,r2=114;
  if(i<=st.plen)cl+=" p";else if(i===o){cl+=" o";r1=92}else if(i>=o-5&&i<=o+1)cl+=" f";
  if(i===t){cl+=" now";r1=88;r2=120}
  k+=`<line class="${cl}" x1="${(130+c*r1).toFixed(1)}" y1="${(130+s*r1).toFixed(1)}" x2="${(130+c*r2).toFixed(1)}" y2="${(130+s*r2).toFixed(1)}"/>`
 }
 const n1=pr[0],late=t-N;
 const mid=late>0?`<div class="big">Día ${t}</div><div class="sm">${late} día${late>1?"s":""} más que tu promedio de ${N}</div>`:`<div class="big">Día ${t}</div><div class="sm">de unos ${N}</div>`;
 const warn=late>st.sp?`<p class="note">Esto supera tu rango habitual. Registrá la fecha cuando llegue. Si no lo esperabas, considerá un test de embarazo o consultar con un profesional de la salud.</p>`:"";
 return`<section class="hero"><div class="ringw"><svg viewBox="0 0 260 260" role="img" aria-label="Anillo del ciclo, hoy es el día ${t} de unos ${N}">${k}</svg><div class="ctr">${mid}</div></div>
 <div><dl><dt>Próxima menstruación (estimación)</dt><dd>${fmt(n1.s)}<br><span class="sm">probable del ${sh(n1.s-n1.sp)} al ${sh(n1.s+n1.sp)}</span></dd>
 <dt>Ovulación estimada</dt><dd>${sh(n1.ov)} <span class="sm">± ${n1.sp} días</span></dd>
 <dt>Ventana fértil estimada</dt><dd>del ${sh(n1.f1)} al ${sh(n1.f2)}</dd>
 <dt>Confianza</dt><dd>${st.conf}</dd></dl></div>
 ${warn?`<div style="grid-column:1/-1">${warn}</div>`:""}</section>`
}
function wN(st){return st.wchg?`<p class="note">Registraste un cambio de peso de más del 5% en los últimos 90 días. Los cambios grandes de peso pueden alterar el ciclo, así que esta estimación puede ser menos confiable.</p>`:""}
function logH(){
 if(!pick)pick=F(today());
 return`<section class="card"><h2>Registrar</h2><div class="row"><label>Fecha<input type="date" id="dt" value="${pick}" max="${F(today())}"></label>
 <button class="pri" data-a="start">Empezó la menstruación</button><button class="btn" data-a="end">Terminó</button></div><div class="row" style="margin-top:14px"><label>Tu edad (opcional)<input type="number" id="age" min="12" max="60" inputmode="numeric" value="${S.age||""}" style="width:110px;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)"></label><label>Altura en cm (opcional)<input type="number" id="h" min="120" max="220" inputmode="numeric" value="${S.h||""}"></label><label>Peso en kg (opcional)<input type="number" id="w" min="30" max="250" step="0.1" inputmode="decimal" value="${S.w||""}"></label></div><p class="sub" style="margin:8px 0 0">La edad ajusta la estimación inicial. La altura y el peso solo amplían el margen de error si el IMC es 30 o más. Todo se guarda solo en este navegador.</p></section>`
}
function calH(st,pr){
 const y=V.getFullYear(),mo=V.getMonth(),first=Math.round(Date.UTC(y,mo,1)/864e5),dim=new Date(y,mo+1,0).getDate(),lead=(first+3)%7,td=today();
 let h="";["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(w=>h+=`<div class="wd">${w}</div>`);
 for(let i=0;i<lead;i++)h+=`<div class="d x"></div>`;
 for(let d=1;d<=dim;d++){
  const n=first+d-1;let c="d";
  const lg=st.p.some(x=>n>=D(x.start)&&n<=(x.end?D(x.end):D(x.start)+st.plen-1));
  if(lg)c+=" lg";
  else{
   for(const q of pr){
    if(n>=q.s&&n<=q.s+st.plen-1){c+=" pp";break}
    if(n>=q.s-q.sp&&n<=q.s+q.sp){c+=" pr";break}
   }
   for(const q of pr){if(n===q.ov){c+=" ov";break}if(n>=q.f1&&n<=q.f2){c+=" fw";break}}
  }
  if(n===td)c+=" td";if(F(n)===pick)c+=" sel";
  h+=`<button class="${c}" data-a="day" data-d="${F(n)}" aria-label="${fmt(n)}">${d}</button>`
 }
 const title=V.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
 return`<section class="card"><div class="calh"><button class="btn" data-a="prev" aria-label="Mes anterior">‹</button><h2 style="margin:0">${title}</h2><button class="btn" data-a="next" aria-label="Mes siguiente">›</button></div>
 <div class="grid">${h}</div>
 <div class="leg"><span><i style="background:var(--pe)"></i>Menstruación registrada</span><span><i style="border:2px solid var(--pe);background:repeating-linear-gradient(135deg,var(--peb) 0 3px,color-mix(in srgb,var(--pe) 38%,var(--peb)) 3px 6px)"></i>Menstruación prevista</span><span><i style="border:1px dashed var(--pe);background:color-mix(in srgb,var(--pe) 14%,transparent)"></i>Rango posible</span><span><i style="background:var(--feb)"></i>Ventana fértil</span><span><i style="box-shadow:inset 0 0 0 2px var(--fe)"></i>Ovulación</span></div>
 <div class="selbar"><strong>Día seleccionado: ${pick?fmt(D(pick)):"elegí un día"}</strong><button class="pri" data-a="start">Empezó la menstruación</button><button class="btn" data-a="end">Terminó</button></div></section>`
}
function insH(st){
 if(!st.n)return`<section class="card"><h2>Tus patrones</h2><p class="sub">Registrá al menos dos inicios de menstruación para ver la duración de tu ciclo.${st.age?` Con tu edad (${st.age}), la estimación inicial es de ${st.prior.toFixed(1)} días.`:""}</p></section>`;
 return`<section class="card"><h2>Tus patrones</h2><dl>
 <dt>Ciclos usados (hasta 6)</dt><dd>${st.n}: ${st.rec.join(", ")} días</dd>
 <dt>Ciclo promedio</dt><dd>${st.mean.toFixed(1)} días${st.sd!=null?`, variación ±${st.sd.toFixed(1)}`:""}</dd>${st.age?`<dt>Efecto de la edad</dt><dd>Referencia para tu edad: ${st.prior.toFixed(1)} días. Pesa más cuando hay pocos ciclos.</dd>`:""}
 ${st.bmi?`<dt>IMC</dt><dd>${st.bmi.toFixed(1)}${st.bmi>=30?". Se amplió un 14% el margen de error, según Bull 2019.":". No modifica la estimación."}</dd>`:""}<dt>Duración promedio de la menstruación</dt><dd>${st.plen} días${S.periods.some(x=>x.end)?"":" (valor por defecto hasta que registres finales)"}</dd></dl>
 <p class="note">Método: el próximo inicio es tu último inicio más tu ciclo promedio, combinado con una referencia por edad cuando hay pocos datos. La ovulación se ubica ${L} días antes, cerca de la fase lútea promedio de la población. El rango se amplía con tu propia variación, y un día más si tenés menos de 20 o 40 años o más.</p></section>`
}
function histH(st){
 if(!st.p.length)return"";
 const li=[...st.p].reverse().map(x=>`<li><span>${sh(D(x.start))}${x.end?" a "+sh(D(x.end)):""}</span><button data-a="del" data-s="${x.start}">Borrar</button></li>`).join("");
 return`<section class="card"><h2>Historial</h2><ul class="hist">${li}</ul></section>`
}
const R=[
["Los ciclos varían más que el «ciclo de 28 días» de los libros","En más de 600.000 ciclos de 124.648 usuarias, el ciclo promedio fue de 29,3 días, solo cerca del 13% duró exactamente 28 días y el 65% de las mujeres tuvo ciclos de 25 a 30 días. La fase folicular promedió 16,9 días y la lútea 12,4.","Bull et al., npj Digital Medicine, 2019 (resumen UCL)","https://www.ucl.ac.uk/news/2019/aug/individualised-approach-fertile-windows-could-benefit-many-women"],
["La edad cambia el ciclo","Entre los 25 y los 45 años, la duración promedio del ciclo bajó unos 0,18 días por cada año de edad. La variación entre ciclos fue cerca de un 14% mayor en mujeres con obesidad. Por eso esta herramienta usa tu edad como punto de partida cuando tenés pocos ciclos registrados.","Bull et al., 2019 (resumen EurekAlert)","https://www.eurekalert.org/news-releases/763576"],
["La ventana fértil dura unos seis días y su momento se mueve","El embarazo es posible en los cinco días previos a la ovulación y el día de la ovulación. En un estudio de 221 mujeres que buscaban embarazo, solo cerca del 30% tuvo toda la ventana entre los días 10 y 17. La ovulación ocurrió entre el día 8 y el 60, y aun con ciclos regulares había hasta un 6% de probabilidad de estar en la ventana el día en que se esperaba la menstruación.","Wilcox et al., BMJ, 2000","https://www.bmj.com/lookup/volpage/321/1259"],
["Predecir solo con fechas puede errar la ventana","Los autores del estudio de 2019 señalaron que las apps que predicen días fértiles solo con fechas pueden no captar la ventana, algo coherente con estudios previos sobre apps de calendario. La temperatura o los tests de ovulación aportan información real.","Bull et al., 2019","https://medicalxpress.com/news/2019-08-individualised-approach-fertile-windows-benefit.pdf"],
["Incluso los ciclos sanos varían de un mes a otro","En mujeres con ciclos regulares, la media fue de 28,9 días (DE 3,4) y el 95% de los ciclos estuvo entre 22 y 36 días. Más del 42% tuvo una diferencia de más de 7 días entre su ciclo más corto y el más largo. La fase folicular explicó la mayor parte de esa variación.","Fehring et al., JOGNN, 2006","https://pubmed.ncbi.nlm.nih.gov/16700687/"],
["La fase lútea no es fija en 14 días","En un estudio de un año con mujeres sanas que ovulaban normalmente, el 55% tuvo al menos una fase lútea corta (menos de 10 días) y el 17% al menos un ciclo sin ovulación. La fase lútea varió menos que la folicular, pero no tan poco como suele suponerse.","Human Reproduction, 2024","https://pubmed.ncbi.nlm.nih.gov/39320898/"],
["Duración típica del sangrado y dispersión del ciclo","Un análisis conjunto de tres cohortes informó una menstruación promedio de 6,2 días y un ciclo promedio de 30,3 días (mediana 29). Cerca del 43% de las mujeres tuvo una diferencia de más de 7 días entre sus propios ciclos.","Paediatric and Perinatal Epidemiology, 2020","https://pubmed.ncbi.nlm.nih.gov/32104920/"]
];
function resH(){
 return`<section class="card"><h2>Qué dice la investigación</h2>${R.map(r=>`<div class="fi"><h3>${r[0]}</h3><p>${r[1]}</p><p class="src"><a href="${r[3]}" target="_blank" rel="noopener noreferrer">${r[2]}</a></p></div>`).join("")}</section>
 <section class="card"><h2>Cuándo consultar a un profesional</h2><p>Motivos que suelen citarse para hacerse revisar, aparte de los estudios de arriba: menstruaciones que se detienen tres meses o más sin embarazo, ciclos que son seguido más cortos de 21 o más largos de 35 días, sangrado de más de 7 días o que empapa la protección cada una o dos horas, dolor intenso o sangrado entre menstruaciones. Tu profesional conoce tu historia y puede orientarte.</p>
 <p class="note">Esta herramienta da estimaciones. No es consejo médico ni un método anticonceptivo.</p></section>`
}
function privH(){
 return`<section class="card"><h2>Cómo se guardan tus datos</h2><p>La página se carga por HTTPS. Tus datos (fechas, edad, altura y peso) se guardan en el almacenamiento local de este navegador, en este dispositivo, y la página no los envía por la red, así que no quedan en ningún servidor.</p>
 <p class="note">Borrar los datos del sitio o usar otro navegador o dispositivo elimina u oculta tus registros. Copiá una copia de seguridad abajo si querés conservarlos.</p></section>
 <section class="card"><h2>Copia de seguridad y restauración</h2><textarea id="bk" aria-label="Copia de seguridad">${JSON.stringify(S)}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn" data-a="copy">Copiar copia</button><button class="btn" data-a="load">Cargar datos pegados</button><button class="btn" data-a="wipe">${wipeArm?"Tocá de nuevo para borrar todo":"Borrar todos los datos"}</button></div></section>`
}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===tab));
 const st=stats(),pr=proj(st);
 $("#app").innerHTML=tab==="track"?ringH(st,pr)+wN(st)+logH()+calH(st,pr)+insH(st)+histH(st):tab==="research"?resH():privH()
}
document.addEventListener("change",e=>{if(e.target.id==="dt")pick=e.target.value;if(e.target.id==="h"||e.target.id==="w"){const k=e.target.id,v=+e.target.value,ok=k==="h"?v>=120&&v<=220:v>=30&&v<=250;if(ok){S[k]=v;if(k==="w")(S.wlog=S.wlog||[]).push({d:F(today()),w:v})}else{delete S[k];e.target.value=""}save();render()}
 if(e.target.id==="age"){const v=Math.round(+e.target.value);if(v>=12&&v<=60)S.age=v;else{delete S.age;e.target.value=""}save();render()}});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a!=="wipe")wipeArm=false;
 const dt=$("#dt");if(dt&&dt.value)pick=dt.value;
 if(a==="tab"){tab=b.dataset.v}
 else if(a==="start"){if(!pick)return;if(S.periods.some(x=>x.start===pick))toast("Esa fecha ya está registrada");else{S.periods.push({start:pick});save();toast("Inicio guardado")}}
 else if(a==="end"){const c=[...S.periods].filter(x=>x.start<=pick).sort((x,y)=>x.start<y.start?-1:1).pop();
  if(!c)toast("Primero registrá un inicio en ese día o antes");else if(D(pick)-D(c.start)>14)toast("Ese final queda a más de 14 días del inicio");else{c.end=pick;save();toast("Final guardado")}}
 else if(a==="del"){S.periods=S.periods.filter(x=>x.start!==b.dataset.s);save()}
 else if(a==="day"){pick=b.dataset.d}
 else if(a==="prev"){V=new Date(V.getFullYear(),V.getMonth()-1,1)}
 else if(a==="next"){V=new Date(V.getFullYear(),V.getMonth()+1,1)}
 else if(a==="copy"){const t=$("#bk");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Copiado"),()=>toast("Mantené presionado para copiar el texto seleccionado"))}catch(x){toast("Mantené presionado para copiar el texto seleccionado")}return}
 else if(a==="load"){try{const o=JSON.parse($("#bk").value);const ok=o&&Array.isArray(o.periods)&&o.periods.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.start)&&(!x.end||/^\d{4}-\d{2}-\d{2}$/.test(x.end)));
   if(!ok)throw 0;S={periods:o.periods.map(x=>x.end?{start:x.start,end:x.end}:{start:x.start}),age:+o.age>=12&&+o.age<=60?+o.age:undefined,h:+o.h||undefined,w:+o.w||undefined,wlog:Array.isArray(o.wlog)?o.wlog.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)&&+x.w>0).map(x=>({d:x.d,w:+x.w})):undefined};save();toast("Datos cargados")}catch(x){toast("Eso no parece una copia válida")}}
 else if(a==="wipe"){if(!wipeArm){wipeArm=true}else{S={periods:[]};wipeArm=false;save();toast("Datos borrados")}}
 render()
});
load();render();
</script>
</body>
</html>
